name: ShadowCheck self-demo
on:
  workflow_dispatch:
jobs:
  replay-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: docker compose --profile demo up -d --build
      - run: docker compose exec -T api pnpm --filter @shadowcheck/cli dev run --project demo-commerce-api --wait
        continue-on-error: true
      - run: docker compose logs --no-color
        if: always()
      - run: docker compose down -v
        if: always()
